<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ea"/>
      <stop offset="45%" stop-color="#dfeade"/>
      <stop offset="100%" stop-color="#cfe3cd"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.12" r="0.6">
      <stop offset="0%" stop-color="#f7e0a4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f7e0a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8ec7a4"/>
      <stop offset="100%" stop-color="#3f7d59"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f0d488"/>
      <stop offset="100%" stop-color="#c08f2c"/>
    </linearGradient>
    <linearGradient id="leafC" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#cbe3cd"/>
      <stop offset="100%" stop-color="#7baa86"/>
    </linearGradient>
    <!-- 银杏叶：填充继承自使用处的 fill -->
    <g id="leaf">
      <path d="M0 0 C -46 -26 -52 -84 0 -104 C 52 -84 46 -26 0 0 Z"/>
      <path d="M0 0 L0 -96" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.2" fill="none"/>
      <path d="M0 -34 L-20 -66 M0 -34 L20 -66 M0 -62 L-15 -84 M0 -62 L15 -84" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6" fill="none"/>
    </g>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#sun)"/>

  <!-- 枝干 -->
  <g opacity="0.42" stroke="#6d8f74" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M1150 200 C 1225 128 1345 96 1450 116"/>
    <path d="M1245 320 C 1340 258 1455 264 1570 306"/>
    <path d="M1085 340 C 1135 308 1180 294 1228 292"/>
    <path d="M1265 480 C 1330 420 1430 400 1520 420"/>
  </g>

  <!-- 主景叶片 -->
  <g fill="url(#leafA)">
    <use href="#leaf" transform="translate(1150 200) rotate(18) scale(1.4)"/>
    <use href="#leaf" transform="translate(1340 320) rotate(-24) scale(1.05)" opacity="0.92"/>
    <use href="#leaf" transform="translate(1260 480) rotate(-8) scale(1.6)" opacity="0.8"/>
  </g>
  <g fill="url(#leafB)">
    <use href="#leaf" transform="translate(1030 330) rotate(52) scale(0.92)"/>
    <use href="#leaf" transform="translate(1455 116) rotate(34) scale(0.98)" opacity="0.88"/>
    <use href="#leaf" transform="translate(1530 520) rotate(28) scale(1.1)" opacity="0.75"/>
  </g>
  <g fill="url(#leafC)">
    <use href="#leaf" transform="translate(880 470) rotate(64) scale(0.95)" opacity="0.75"/>
    <use href="#leaf" transform="translate(980 210) rotate(-30) scale(0.72)" opacity="0.6"/>
  </g>
</svg>
