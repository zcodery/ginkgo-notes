<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>银杏笔记</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>" />
    <style>
      /*
        启动画面：整段内联在 HTML 里，样式/JS 还没下载完就能先画出来。
        慢网下原本是纯白屏，用户分不清是在加载还是挂了；这里给品牌标记 + 细进度条 + 提示。
        由 App.vue 在 store.authReady 置位后调用 window.gnBootDone() 淡出。
      */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
      }
      html.gn-dark,
      html.gn-dark body {
        background: #1c1c1b;
      }

      #gn-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* 重心略高于几何中心，视觉上更稳 */
        padding-bottom: 3vh;
        background: #ffffff;
        color: #252523;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        --gn-boot-fg: #252523;
        --gn-boot-fg-soft: #5f5f5c;
        --gn-boot-muted: #96968f;
        --gn-boot-line: rgba(37, 37, 35, 0.1);
        --gn-boot-danger: #d64545;
        --gn-boot-ink: #ffffff;
        --gn-boot-glow: color-mix(in srgb, var(--gn-boot-accent) 6%, transparent);
        --gn-boot-vignette: rgba(37, 37, 35, 0.05);
        /* 延迟 120ms 才浮现：秒开时不会闪一下 logo */
        opacity: 0;
        animation: gn-boot-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.12s forwards;
        transition: opacity 0.45s ease;
        -webkit-user-select: none;
        user-select: none;
      }
      html.gn-dark #gn-boot {
        background: #1c1c1b;
        color: #ececea;
        --gn-boot-fg: #ececea;
        --gn-boot-fg-soft: #b3b3ad;
        --gn-boot-muted: #83837c;
        --gn-boot-line: rgba(236, 236, 234, 0.13);
        --gn-boot-danger: #e46a6a;
        --gn-boot-ink: #12161f;
        --gn-boot-glow: color-mix(in srgb, var(--gn-boot-accent) 10%, transparent);
        --gn-boot-vignette: rgba(0, 0, 0, 0.3);
      }
      /* 极淡的主色光晕，只在中心区域，避免启动时整屏发灰 */
      #gn-boot::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          42vmin 42vmin at 50% 44%,
          var(--gn-boot-glow),
          transparent 72%
        );
      }
      /* 底部压暗一档，把视线收在品牌块上 */
      #gn-boot::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          120% 72% at 50% 110%,
          var(--gn-boot-vignette),
          transparent 62%
        );
      }
      #gn-boot.is-done {
        /* 关掉 fill-forwards 的入场动画，否则它会一直压住 opacity，淡出失效 */
        animation: none;
        opacity: 0;
        pointer-events: none;
      }

      .gn-boot-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        font-size: 56px;
        line-height: 1;
        animation: gn-mark-rise 0.95s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
      }

      .gn-boot-bar {
        position: relative;
        width: 120px;
        height: 2.5px;
        margin-top: 16px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--gn-boot-line);
        animation: gn-rise-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
      }
      .gn-boot-bar span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 38%;
        border-radius: inherit;
        background: var(--gn-boot-accent, #2f6b4f);
        animation: gn-bar-slide 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      .gn-boot-name {
        margin-top: 26px;
        padding-left: 0.3em;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: 0.3em;
        animation: gn-rise-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
      }

      .gn-boot-hint {
        margin-top: 12px;
        min-height: 15px;
        font-size: 11.5px;
        letter-spacing: 0.08em;
        color: var(--gn-boot-muted);
        animation: gn-rise-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.52s both;
      }

      /* 底部信息栏：左英文小标，右初始化状态 */
      .gn-boot-foot {
        position: absolute;
        left: 30px;
        right: 30px;
        bottom: 26px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        line-height: 1;
        letter-spacing: 0.16em;
        color: var(--gn-boot-muted);
        opacity: 0;
        animation: gn-boot-fade 0.8s ease 0.7s forwards;
      }
      .gn-boot-foot span:last-child {
        letter-spacing: 0.08em;
      }
      /* 超过 6 秒还没好：补一句，避免用户以为卡死 */
      .gn-boot-slow {
        margin-top: 9px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--gn-boot-muted);
        opacity: 0;
        animation: gn-boot-fade 0.6s ease 6s forwards;
      }

      #gn-boot-fail {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 11px;
      }
      #gn-boot.is-failed .gn-boot-bar {
        display: none;
      }
      #gn-boot.is-failed .gn-boot-mark {
        filter: grayscale(1);
        opacity: 0.5;
        animation: none;
      }
      #gn-boot.is-failed .gn-boot-hint,
      #gn-boot.is-failed .gn-boot-slow,
      #gn-boot.is-failed .gn-boot-foot {
        display: none;
      }
      #gn-boot.is-failed #gn-boot-fail {
        display: flex;
      }
      .gn-boot-fail-text {
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--gn-boot-fg-soft);
      }
      #gn-boot-retry {
        height: 30px;
        padding: 0 15px;
        border: 0;
        border-radius: 999px;
        background: var(--gn-boot-accent, #2f6b4f);
        color: var(--gn-boot-ink, #fff);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.04em;
        cursor: pointer;
        /* 只过渡底色，不动边框和阴影 */
        transition: background-color 0.3s ease, opacity 0.3s ease;
      }
      #gn-boot-retry:hover {
        background: color-mix(in srgb, var(--gn-boot-accent, #2f6b4f) 86%, #ffffff);
      }
      html.gn-dark #gn-boot-retry:hover {
        background: color-mix(in srgb, var(--gn-boot-accent, #6cb894) 88%, #000000);
      }

      @keyframes gn-boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes gn-boot-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes gn-bar-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(372%);
        }
      }
      @keyframes gn-rise-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes gn-mark-rise {
        from {
          opacity: 0;
          transform: translateY(7px) scale(0.86);
        }
        to {
          opacity: 1;
          transform: translateY(1px);
        }
      }
      /* 尊重系统的「减少动效」偏好 */
      @media (prefers-reduced-motion: reduce) {
        #gn-boot {
          animation: none;
          opacity: 1;
        }
        .gn-boot-bar span {
          animation: none;
          width: 45%;
        }
        .gn-boot-mark,
        .gn-boot-name,
        .gn-boot-bar,
        .gn-boot-hint {
          animation: none;
        }
        .gn-boot-foot {
          animation: none;
          opacity: 0.6;
        }
      }
      @media (max-width: 560px) {
        .gn-boot-foot {
          left: 20px;
          right: 20px;
          bottom: 20px;
          font-size: 9.5px;
        }
      }
    </style>
  </head>
  <body>
    <div id="gn-boot" role="status" aria-live="polite" aria-label="正在加载银杏笔记">
      <span class="gn-boot-mark" aria-hidden="true">🍃</span>
      <div class="gn-boot-name">银杏笔记</div>
      <div class="gn-boot-bar" aria-hidden="true"><span></span></div>
      <div class="gn-boot-hint">正在加载…</div>
      <div class="gn-boot-slow">网络有点慢，正在继续加载</div>
      <div id="gn-boot-fail">
        <div class="gn-boot-fail-text">加载没有完成，可能是网络中断</div>
        <button id="gn-boot-retry" type="button">重新加载</button>
      </div>
      <div class="gn-boot-foot" aria-hidden="true">
        <span>GINKGO NOTES</span>
        <span>正在初始化数据</span>
      </div>
    </div>

    <div id="app"></div>

    <script>
      /* 启动屏控制：主题/主色在框架起来之前先读一遍本机偏好，避免白屏后突然变暗 */
      ;(function () {
        var root = document.documentElement
        var el = document.getElementById('gn-boot')
        var dark = false
        var accent = '#2f6b4f'
        try {
          var t = localStorage.getItem('ginkgo-meta:theme')
          t = t === null ? null : JSON.parse(t)
          dark =
            t === 'dark' ||
            (t === null &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var a = localStorage.getItem('ginkgo-meta:accentColor')
          a = a === null ? 'pine' : JSON.parse(a)
          var map = {
            pine: ['#2f6b4f', '#6cb894'],
            indigo: ['#3b5fbf', '#8aa9f0'],
            violet: ['#7550b5', '#b493e8'],
            amber: ['#a8621f', '#e3a866'],
            rose: ['#b8465f', '#e792a5'],
            teal: ['#237f8c', '#6fc3d0']
          }
          var pair = map[a] || map.pine
          accent = dark ? pair[1] : pair[0]
        } catch (e) {
          /* 本机存储不可用时用默认配色 */
        }
        if (dark) root.classList.add('gn-dark')
        root.style.setProperty('--gn-boot-accent', accent)
        // 主色底上的文字：暗色主色偏亮，得用深墨，否则白字糊成一片
        root.style.setProperty('--gn-boot-ink', dark ? '#12161f' : '#ffffff')

        // 资源真的没加载出来时给重试入口，而不是一直转圈让用户干等
        function fail() {
          if (!el || el.classList.contains('is-failed')) return
          el.classList.add('is-failed')
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e && e.target && e.target.tagName === 'SCRIPT') fail()
          },
          true
        )
        window.addEventListener('unhandledrejection', function (e) {
          var m = String((e.reason && e.reason.message) || e.reason || '')
          if (/dynamically imported module|Importing a module script failed|Loading chunk|Failed to fetch/i.test(m))
            fail()
        })
        var retry = document.getElementById('gn-boot-retry')
        if (retry)
          retry.addEventListener('click', function () {
            location.replace(location.pathname + '?_r=' + Date.now())
          })

        window.gnBootDone = function () {
          if (!el) return
          el.classList.add('is-done')
          // 与 CSS 里 0.45s 淡出对齐，别提前把节点抽掉
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el)
          }, 480)
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
